<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CV - Fallou Wade</title>
	<link rel="stylesheet" href="style.css">
	<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body id="body-fallou">
	<!-- Barre de navigation -->
	<div id="navigation-bar">
		<a href="Accuil.html" id="back-button">
			<span class="fa fa-arrow-circle-left" style="font-size:36px"></span>
		</a>
		
		<!-- Bouton de basculement de thème avec tooltip -->
		<div class="theme-toggle-container-fallou" id="theme-toggle-container-fallou">
			<button id="theme-toggle-fallou" class="tooltip">
				<i class="material-icons">dark_mode</i>
				<span class="tooltip-text" id="tooltip-text">Mode sombre</span>
			</button>
		</div>
	</div>
		
	<!-- Section principale du CV -->
	<section style="width: 60%; margin: auto; border: 1px solid;" id="section-fallou">
		 
		<!-- Header avec informations profil -->
		<section>
			<div id="main-header">
				<div>
					<img id="profile-image" src="" alt="Profile Image">
				</div>

				<div id="header-info-container">
					<p id="profile-name"></p>
					
					<div id="profile-email-container">
						<i class="material-icons" style="font-size:26px">email</i>
						<span id="profile-email"></span> 
					</div>

					<div id="profile-phone-container">
						<i class="material-icons" style="font-size:26px">call</i>
						<span id="profile-phone"></span>
					</div>

					<div id="profile-address-container">
						<i class="material-icons" style="font-size:26px">edit_location</i>
						<span id="profile-address"></span>
					</div>
				</div>
			</div>
		</section>

		<!-- Section contenu principal -->
		<section id="main-content">
			
			<!-- Section Expérience Professionnelle -->
			<div class="block" id="experience-section">
				<div id="experience-section-header">
					<i class="material-icons" style="font-size:36px" id="experience-icon">card_travel</i>
					<h3 id="experience-title">Expérience professionnel</h3>
				</div>
				<ul id="experience-list">
					<li id="exp-1"></li>
					<li id="exp-2"></li>
					<li id="exp-3"></li>
				</ul>
			</div>

			<!-- Section Compétences Techniques -->
			<div class="block" id="competences-section">
				<div id="competences-section-header">
					<i class="material-icons" style="font-size:36px" id="competences-icon">input</i>
					<h3 id="competences-title">Compétences Techniques</h3>
				</div>
				<ul id="competences-list">
					<li id="comp-1"></li>
					<li id="comp-2"></li>
					<li id="comp-3"></li>
				</ul>
			</div>

			<!-- Section Expérience Bénévole -->
			<div class="block" id="benevole-section">
				<div id="benevole-section-header">
					<i class="material-icons" style="font-size:36px" id="benevole-icon">volunteer_activism</i>
					<h3 id="benevole-title">Expérience Bénévole</h3>
				</div>
				<ul id="benevole-list">
					<li id="ben-1"></li>
					<li id="ben-2"></li>
					<li id="ben-3"></li>
				</ul>
			</div>

			<!-- Section Loisirs -->
			<div class="block" id="loisirs-section">
				<div id="loisirs-section-header">
					<i class="material-icons" style="font-size:36px" id="loisirs-icon">sports_esports</i>
					<h3 id="loisirs-title">Loisirs & Intérêts</h3>
				</div>
				<ul id="loisirs-list">
					<li id="loisir-1"></li>
					<li id="loisir-2"></li>
					<li id="loisir-3"></li>
				</ul>
			</div>

			<!-- Section Contact -->
			<div class="block" id="contact-section">
				<div id="contact-section-header">
					<i class="material-icons" style="font-size:36px" id="contact-icon">contacts</i>
					<h3 id="contact-title">Réseaux & Contact</h3>
				</div>
				<ul id="contact-list">
					<li id="contact-1"></li>
					<li id="contact-2"></li>
					<li id="contact-3"></li>
				</ul>
			</div>

		</section>
		
		<!-- Footer -->
		<footer id="main-footer">
			<h1 id="footer-email"></h1>
		</footer>
	</section>

	<!-- Script JavaScript -->
	<script src="script.js"></script>
</body>
</html>
