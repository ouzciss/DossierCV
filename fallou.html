<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Fallou Wade</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body id="fallou_wade">
    <div>
        <a href="Accuil.html">
            <span class="fa fa-arrow-circle-left" style="font-size:36px"></span>
        </a>
    </div>

    <section style="width: 60%; margin: auto; border: 1px, solid;">
        <section>
            <div id="header">
                <div>
                    <img id="profile-photo-fallou_wade" src="" alt="Profile Image">
                </div>
                <div id="header-icon">
                    <button class="theme-toggle">
                        <i class="fas fa-sun"></i>
                        <i class="fas fa-moon"></i>
                    </button>
                    
                    <p id="name-fallou_wade"></p>
                    <div>
                        <i class="material-icons" style="font-size:26px">email</i>
                        <span id="email-contact-fallou"></span>
                    </div>
                    <div>
                        <i class="material-icons" style="font-size:26px">call</i>
                        <span id="phone-contact-fallou"></span>
                    </div>
                    <div>
                        <i class="material-icons" style="font-size:26px">edit_location</i>
                        <span id="address-contact-fallou"></span>
                    </div>
                </div>
            </div>
        </section>

        <section id="content">
            <div class="block">
                <div>
                    <i class="material-icons" style="font-size:36px">card_travel</i>
                    <h3>Expérience professionnel</h3>
                </div>
                <ul id="experience-list-fallou"></ul>
            </div>

            <div class="block">
                <div>
                    <i class="material-icons" style="font-size:36px">input</i>
                    <h3>Projets</h3>
                </div>
                <ul id="projects-list-fallou"></ul>
            </div>

            <div class="block">
                <div>
                    <i class="material-icons" style="font-size:36px">card_travel</i>
                    <h3>Compétences</h3>
                </div>
                <ul id="competences-list-fallou"></ul>
            </div>

            <div class="block">
                <div>
                    <i class="material-icons" style="font-size:36px">card_travel</i>
                    <h3>Loisirs</h3>
                </div>
                <ul id="loisirs-list-fallou"></ul>
            </div>

            <div class="block">
                <div>
                    <i class="material-icons" style="font-size:36px">card_travel</i>
                    <h3>Contacts</h3>
                </div>
                <ul id="contacts-list-fallou"></ul>
            </div>
        </section>

        <footer>
            <h1 id="footer-email-fallou"></h1>
        </footer>
    </section>
    <script src="script.js"></script>
</body>
</html>
