
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon CV</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body id="ibrahima_diouf" class="body">
  <div>
    <a href="Accuil.html">
      <span class="fas fa-arrow-circle-left" style="font-size:36px"></span>
    </a>
  </div>

  
  <div class="cv-container">
    <header id="header1">
      <button class="theme-toggle">
   <i class="fas fa-sun"></i>
   <i class="fas fa-moon"></i>
  </button>
      <div class="photo">
        <img id="profile-photo-ibrahima" src="Image/image.png" alt="Photo de profil">
      </div>
      <div class="info">
        <h1 id="name-ibrahima"></h1>
        <h2 id="job-title-ibrahima" class="poste"></h2>
        <p>
          <img src="Image/call.png" alt="Téléphone" class="icon">
          <span id="phone-ibrahima"></span>
        </p>
        <p>
          <img src="Image/mail.png" alt="Email" class="icon">
          <span id="email-ibrahima"></span>
        </p>
        <p>
          <img src="Image/adress.png" alt="Localisation" class="icon">
          <span id="location-ibrahima"></span>
        </p>
      </div>
    </header>
    
    <main id="main">
      <aside class="left">
        <section>
          <h3>À propos de moi</h3>
          <p id="profile-text-ibrahima"></p>
        </section>
        
        <section>
          <h3>Competences</h3>
          <ul id="competences-list-ibrahima">
            </ul>
        </section>
        
        <section>
          <h3>Études et Certificats</h3>
          <ul id="etudes-list-ibrahima">
            </ul>
        </section>
        
        <section>
          <h3>Langues</h3>
          <ul id="langues-list-ibrahima">
            </ul>
        </section>
        
        <section>
          <h3>Loisirs</h3>
          <ul id="loisirs-list-ibrahima">
            </ul>
        </section>
      </aside>
    </main>
    
    <footer>
      <div class="footer-content">
        <p>
          <img src="Image/call.png" alt="Téléphone" class="icon-footer">
          <span id="footer-phone-ibrahima"></span>
        </p>
        <p>
          <img src="Image/mail.png" alt="Email" class="icon-footer">
          <span id="footer-email-ibrahima"></span>
        </p>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
