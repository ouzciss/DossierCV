<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Serge Senghor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body id="serge_senghor">
    
    <div>
        <a href="Accuil.html">
            <span class="fa fa-arrow-circle-left" style="font-size:36px"></span>
        </a>
    </div>

    <div class="cv-container1">
        <header class="cv-header">
            <div class="photo-container">
                <img id="profile-photo-serge_senghor" src="Image/uc.jpg" alt="Photo de profil" class="profile-photo rotate-photo">
            </div>
            <div class="contact-info">
                <button class="theme-toggle">
                    <i class="fas fa-sun"></i>
                    <i class="fas fa-moon"></i>
                </button>
                
                <h1 class="contact-field" data-field="prenom"><span class="icon icon-rotate">&#128100;</span> <span class="label">Prénom :</span> <span id="prenom-serge" class="value"></span></h1>
                <h1 class="contact-field" data-field="nom"><span class="icon icon-rotate">&#128100;</span> <span class="label">Nom :</span> <span id="nom-serge" class="value"></span></h1>
                <h1 class="contact-field" data-field="adresse"><span class="icon icon-rotate">&#128205;</span> <span class="label">Adresse :</span> <span id="adresse-serge" class="value"></span></h1>
                <h1 class="contact-field" data-field="telephone"><span class="icon icon-rotate">&#9742;</span> <span class="label">Téléphone :</span> <span id="phone-serge" class="value"></span></h1>
                <h1 class="contact-field" data-field="email"><span class="icon icon-rotate">&#128231;</span> <span class="label">Email :</span> <span id="email-serge" class="value"></span></h1>
            </div>
        </header>

        <main class="cv-main">
            <section class="competences">
                <h2><span class="icon icon-rotate">🛠️</span> Compétences</h2>
                <ul id="competences-list-serge"></ul>
            </section>

            <section class="etudes">
                <h2><span class="icon icon-rotate">🎓</span> Études et Certificats</h2>
                <ul id="etudes-list-serge"></ul>
            </section>
            
            <section class="langues">
                <h2><span class="icon icon-rotate">🌐</span> Langues</h2>
                <ul id="langues-list-serge"></ul>
            </section>
            
            <section class="loisirs">
                <h2><span class="icon icon-rotate">🎲</span> Loisirs</h2>
                <ul id="loisirs-list-serge"></ul>
            </section>
        </main>
        
        <footer class="cv-footer">
            <h4>Contact</h4>
            <p>Téléphone : <span id="footer-phone-serge"></span></p>
            <p>Email : <span id="footer-email-serge"></span></p>
        </footer>
    </div>
    
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            injectData('serge_senghor');
        });
    </script>
</body>
</html>
